<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="./styles.css">
<style>
  html,body{margin:0;height:100%}
  .tile{width:1280px;height:854px;display:flex;font-family:var(--font-display)}
  .main{flex:1;background:var(--blue-500);display:flex;align-items:center;justify-content:center}
  .mark{width:560px;height:560px}
  .strip{width:200px;display:flex;flex-direction:column}
  .strip>div{flex:1}
</style>
</head>
<body>
<div class="tile">
  <div class="main"><svg class="mark" viewBox="0 0 96 96" fill="none" aria-label="ARE iptv"><rect x="6" y="6" width="84" height="84" rx="24" fill="#ffffff"/><path d="M40 34 L64 48 L40 62 Z" fill="var(--blue-500)"/><g stroke="var(--blue-500)" stroke-width="3.4" stroke-linecap="round" fill="none"><path d="M26 42 A10 10 0 0 0 26 54" opacity="0.9"/><path d="M20 37 A17 17 0 0 0 20 59" opacity="0.5"/></g></svg></div>
  <div class="strip">
    <div style="background:#eab308"></div>
    <div style="background:#22c55e"></div>
    <div style="background:#8b5cf6"></div>
    <div style="background:#ef4444"></div>
  </div>
</div>
</body>
</html>
