<!-- @dsCard group="Brand" viewport="700x200" name="Logo" subtitle="Broadcast-play mark + wordmark — dark / light" -->
<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-display);height:200px;display:flex}
.dark{flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg-base)}
.light{flex:1;display:flex;align-items:center;justify-content:center;background:var(--white)}
.lockup{display:flex;align-items:center;gap:18px}
.wm{font:var(--fw-bold) 46px/1 var(--font-display);letter-spacing:-1.8px;display:flex}
.mark{width:64px;height:64px;flex:none}</style></head>
<body>
<div class="dark">
  <div class="lockup">
    <svg class="mark" viewBox="0 0 96 96" fill="none" aria-label="ARE iptv mark"><rect x="6" y="6" width="84" height="84" rx="24" fill="var(--blue-500)"/><rect x="6" y="6" width="84" height="84" rx="24" fill="none" stroke="#93c5fd" stroke-opacity="0.5" stroke-width="1.5"/><path d="M40 34 L64 48 L40 62 Z" fill="#fff"/><g stroke="#fff" stroke-width="3.4" stroke-linecap="round" fill="none"><path d="M26 42 A10 10 0 0 0 26 54" opacity="0.9"/><path d="M20 37 A17 17 0 0 0 20 59" opacity="0.5"/></g></svg>
    <span class="wm"><span style="color:var(--blue-500)">ARE</span><span style="color:#f6f8fc;font-weight:500">&nbsp;iptv</span></span>
  </div>
</div>
<div class="light">
  <div class="lockup">
    <svg class="mark" viewBox="0 0 96 96" fill="none" aria-label="ARE iptv mark"><rect x="6" y="6" width="84" height="84" rx="24" fill="var(--blue-600)"/><path d="M40 34 L64 48 L40 62 Z" fill="#fff"/><g stroke="#fff" stroke-width="3.4" stroke-linecap="round" fill="none"><path d="M26 42 A10 10 0 0 0 26 54" opacity="0.9"/><path d="M20 37 A17 17 0 0 0 20 59" opacity="0.55"/></g></svg>
    <span class="wm"><span style="color:var(--blue-600)">ARE</span><span style="color:#0d1017;font-weight:500">&nbsp;iptv</span></span>
  </div>
</div>
</body></html>
