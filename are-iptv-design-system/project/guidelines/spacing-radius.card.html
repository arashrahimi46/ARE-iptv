<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radius" subtitle="Soft, not pill-y; chips & badges are full pills" -->
<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);padding:24px 26px;font-family:var(--font-body);display:flex;gap:16px;align-items:flex-end}
.c{display:flex;flex-direction:column;align-items:center;gap:8px}
.b{width:82px;height:70px;background:var(--surface-2);border:1px solid var(--border-strong)}
.n{font:var(--fw-bold) 12px/1 var(--font-body);color:var(--text-secondary)}.v{font:var(--fw-medium) 11px/1 var(--font-mono);color:var(--text-tertiary)}</style></head>
<body>
<div class="c"><div class="b" style="border-radius:var(--r-sm)"></div><span class="n">sm</span><span class="v">10</span></div>
<div class="c"><div class="b" style="border-radius:var(--r-md)"></div><span class="n">md · tiles</span><span class="v">14</span></div>
<div class="c"><div class="b" style="border-radius:var(--r-lg)"></div><span class="n">lg · cards</span><span class="v">20</span></div>
<div class="c"><div class="b" style="border-radius:var(--r-xl)"></div><span class="n">xl · hero</span><span class="v">28</span></div>
<div class="c"><div class="b" style="border-radius:var(--r-pill);width:110px"></div><span class="n">pill · chips</span><span class="v">999</span></div>
</body></html>
