<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);padding:22px 24px;font-family:var(--font-body);display:flex;gap:14px}
.sw{flex:1;height:104px;border-radius:var(--r-md);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;border:1px solid var(--border-subtle)}
.n{font:var(--fw-bold) 13px/1.2 var(--font-body);color:#fff}.h{font:var(--fw-medium) 11px/1.4 var(--font-mono);color:rgba(255,255,255,.7)}</style></head>
<body>
<div class="sw" style="background:var(--blue-300)"><span class="n" style="color:#0a0b0f">blue-300</span><span class="h" style="color:rgba(10,11,15,.6)">#93c5fd</span></div>
<div class="sw" style="background:var(--blue-400)"><span class="n" style="color:#0a0b0f">blue-400</span><span class="h" style="color:rgba(10,11,15,.6)">#60a5fa</span></div>
<div class="sw" style="background:var(--blue-500);box-shadow:var(--glow-accent)"><span class="n">blue-500 · accent</span><span class="h">#3b82f6</span></div>
<div class="sw" style="background:var(--blue-600)"><span class="n">blue-600</span><span class="h">#2563eb</span></div>
<div class="sw" style="background:var(--blue-700)"><span class="n">blue-700</span><span class="h">#1d4ed8</span></div>
</body></html>
