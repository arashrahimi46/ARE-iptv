<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="8px grid; generous TV overscan safe-area" -->
<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);padding:24px 26px;font-family:var(--font-body);display:flex;align-items:flex-end;gap:16px}
.c{display:flex;flex-direction:column;align-items:center;gap:8px}
.b{background:var(--accent);border-radius:4px;width:100%}
.n{font:var(--fw-bold) 12px/1 var(--font-body);color:var(--text-secondary)}.v{font:var(--fw-medium) 11px/1 var(--font-mono);color:var(--text-tertiary)}</style></head>
<body>
<div class="c" style="width:16px"><div class="b" style="height:16px"></div><span class="n">2</span><span class="v">8</span></div>
<div class="c" style="width:24px"><div class="b" style="height:24px"></div><span class="n">3</span><span class="v">12</span></div>
<div class="c" style="width:32px"><div class="b" style="height:32px"></div><span class="n">4</span><span class="v">16</span></div>
<div class="c" style="width:48px"><div class="b" style="height:48px"></div><span class="n">6</span><span class="v">24</span></div>
<div class="c" style="width:64px"><div class="b" style="height:64px"></div><span class="n">8</span><span class="v">32</span></div>
<div class="c" style="width:80px"><div class="b" style="height:80px"></div><span class="n">12</span><span class="v">48</span></div>
<div class="c" style="width:104px"><div class="b" style="height:104px"></div><span class="n">safe-x</span><span class="v">64</span></div>
</body></html>
