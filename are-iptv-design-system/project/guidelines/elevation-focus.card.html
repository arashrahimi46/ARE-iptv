<!-- @dsCard group="Elevation" viewport="700x180" name="Focus glow — the D-pad interaction" subtitle="Scale + accent ring; the single most important TV state" -->
<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);padding:30px 40px;font-family:var(--font-body);display:flex;gap:44px;align-items:center}
.t{width:150px;aspect-ratio:2/3;border-radius:var(--r-md);background:linear-gradient(150deg,var(--surface-3),var(--surface-1))}
.cap{font:var(--fw-bold) 11px/1 var(--font-body);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary);text-align:center;margin-top:14px}</style></head>
<body>
<div><div class="t" style="box-shadow:var(--shadow-tile);outline:1px solid var(--border-subtle);outline-offset:-1px"></div><div class="cap">Resting</div></div>
<div><div class="t" style="transform:scale(1.06);box-shadow:var(--shadow-tile-focus);outline:3px solid var(--focus-ring)"></div><div class="cap" style="color:var(--accent-hover)">Focused</div></div>
<div style="flex:1;color:var(--text-secondary);font:var(--text-body);line-height:1.5">On D-pad focus a tile scales to <b style="color:var(--text-primary)">1.06</b>, gains a <b style="color:var(--text-primary)">3px accent ring</b> and a deeper shadow lift. Travel is 150ms with a slight overshoot.</div>
</body></html>
