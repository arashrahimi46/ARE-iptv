<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);padding:22px 26px;font-family:var(--font-body)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c{padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--border-subtle)}
.k{font:var(--fw-bold) 10px/1 var(--font-body);letter-spacing:var(--ls-caps);text-transform:uppercase;margin-bottom:6px}
.do{color:var(--green-400)}.dont{color:var(--red-400)}
.t{font:var(--text-body);color:var(--text-secondary)}</style></head>
<body>
<div class="g">
<div class="c"><div class="k do">Do</div><div class="t">Add playlist</div></div>
<div class="c"><div class="k dont">Don't</div><div class="t">Let's Get You Set Up! 🎉</div></div>
<div class="c"><div class="k do">Do</div><div class="t">Nothing recorded yet — schedule a recording from any live channel.</div></div>
<div class="c"><div class="k dont">Don't</div><div class="t">Oops! Looks like it's empty here.</div></div>
<div class="c"><div class="k do">Do</div><div class="t">Now · BBC One HD · 22:00 – 22:30</div></div>
<div class="c"><div class="k dont">Don't</div><div class="t">CURRENTLY PLAYING ON YOUR TV RIGHT NOW!!!</div></div>
</div>
</body></html>
