<!-- @dsCard group="Colors" viewport="700x150" name="Light theme surfaces" subtitle="Soft cool greys; darker blue accent for contrast" -->
<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);padding:22px 24px;font-family:var(--font-body);display:flex;gap:14px}
.sw{flex:1;height:104px;border-radius:var(--r-md);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;border:1px solid var(--border-default)}
.n{font:var(--fw-bold) 13px/1.2 var(--font-body);color:var(--text-primary)}.h{font:var(--fw-medium) 11px/1.4 var(--font-mono);color:var(--text-tertiary)}</style></head>
<body>
<div class="sw" style="background:var(--bg-base)"><span class="n">bg-base</span><span class="h">#f3f5f9</span></div>
<div class="sw" style="background:var(--surface-1);box-shadow:var(--shadow-md)"><span class="n">surface-1</span><span class="h">#ffffff</span></div>
<div class="sw" style="background:var(--surface-3)"><span class="n">surface-3</span><span class="h">#eef1f6</span></div>
<div class="sw" style="background:var(--accent)"><span class="n" style="color:#fff">accent</span><span class="h" style="color:rgba(255,255,255,.8)">#2563eb</span></div>
</body></html>
