<!-- @dsCard group="Colors" viewport="700x160" name="Text on dark" subtitle="Four legibility tiers for 10-foot reading" -->
<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);padding:24px 26px;font-family:var(--font-body)}
.r{display:flex;align-items:baseline;gap:16px;padding:9px 0;border-bottom:1px solid var(--border-subtle)}
.t{font:var(--fw-semibold) 22px/1 var(--font-body)}.m{font:var(--fw-medium) 12px/1 var(--font-mono);color:var(--text-tertiary);margin-left:auto}
.k{font:var(--fw-bold) 11px/1 var(--font-body);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary);width:96px}</style></head>
<body>
<div class="r"><span class="k">Primary</span><span class="t" style="color:var(--text-primary)">The News at Ten</span><span class="m">--text-primary</span></div>
<div class="r"><span class="k">Secondary</span><span class="t" style="color:var(--text-secondary)">Now · BBC One HD</span><span class="m">--text-secondary</span></div>
<div class="r"><span class="k">Tertiary</span><span class="t" style="color:var(--text-tertiary)">Drama · Crime · 2019</span><span class="m">--text-tertiary</span></div>
<div class="r" style="border:none"><span class="k">Disabled</span><span class="t" style="color:var(--text-disabled)">Unavailable</span><span class="m">--text-disabled</span></div>
</body></html>
