<!-- @dsCard group="Motion" viewport="700x150" name="Duration & easing" subtitle="Snappy focus/nav; larger easing for overlays" -->
<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);padding:24px 26px;font-family:var(--font-body)}
.r{display:flex;align-items:center;gap:16px;padding:9px 0;border-bottom:1px solid var(--border-subtle)}
.k{font:var(--fw-bold) 13px/1 var(--font-body);color:var(--text-primary);width:120px}
.v{font:var(--fw-medium) 12px/1 var(--font-mono);color:var(--accent-hover);width:80px}
.d{font:var(--text-caption);color:var(--text-tertiary)}</style></head>
<body>
<div class="r"><span class="k">instant</span><span class="v">90ms</span><span class="d">press feedback</span></div>
<div class="r"><span class="k">fast</span><span class="v">150ms</span><span class="d">focus travel, hover, chip toggle</span></div>
<div class="r"><span class="k">base</span><span class="v">220ms</span><span class="d">nav expand, crossfade</span></div>
<div class="r" style="border:none"><span class="k">ease-emph</span><span class="v" style="width:auto">cubic-bezier(.22,1.2,.36,1)</span><span class="d">focus pop overshoot</span></div>
</body></html>
