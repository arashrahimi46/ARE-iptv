<!-- @dsCard group="Colors" viewport="700x170" name="Neutral — Ink ramp (dark)" subtitle="Cool blue-black surfaces the whole UI is built on" -->
<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);padding:22px 24px;font-family:var(--font-body);display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:78px;height:110px;border-radius:var(--r-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;border:1px solid var(--border-subtle)}
.n{font:var(--fw-bold) 11px/1.2 var(--font-body)}.h{font:var(--fw-medium) 10px/1.4 var(--font-mono);opacity:.65}</style></head>
<body>
<div class="sw" style="background:var(--ink-950);color:#c4cad4"><span class="n">950</span><span class="h">#06070a</span></div>
<div class="sw" style="background:var(--ink-900);color:#c4cad4"><span class="n">900 · bg</span><span class="h">#0a0b0f</span></div>
<div class="sw" style="background:var(--ink-800);color:#c4cad4"><span class="n">800 · surf-1</span><span class="h">#14161c</span></div>
<div class="sw" style="background:var(--ink-700);color:#c4cad4"><span class="n">700 · surf-2</span><span class="h">#1f232c</span></div>
<div class="sw" style="background:var(--ink-600);color:#c4cad4"><span class="n">600 · surf-3</span><span class="h">#262a34</span></div>
<div class="sw" style="background:var(--ink-400);color:#0a0b0f"><span class="n">400</span><span class="h">#4b515f</span></div>
<div class="sw" style="background:var(--ink-200);color:#0a0b0f"><span class="n">200</span><span class="h">#9aa2b1</span></div>
<div class="sw" style="background:var(--white);color:#0a0b0f"><span class="n">white</span><span class="h">#f6f8fc</span></div>
</body></html>
