<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

.m{font:var(--fw-medium) 11px/1 var(--font-mono);color:var(--text-tertiary);margin-left:auto}</style></head>
<body>

<div class="r"><span style="font:var(--fw-bold) 12px/1 var(--font-body);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--accent-hover)">Featured tonight</span><span class="m">12 · overline</span></div>
