<!-- @dsCard group="Colors" viewport="700x150" name="Status & Stream Health" subtitle="Strict traffic-light set; violet = AI/smart only" -->
<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);padding:22px 24px;font-family:var(--font-body);display:flex;gap:14px}
.sw{flex:1;height:104px;border-radius:var(--r-md);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#0a0b0f}
.n{font:var(--fw-bold) 13px/1.2 var(--font-body)}.h{font:var(--fw-medium) 11px/1.4 var(--font-mono);opacity:.7}</style></head>
<body>
<div class="sw" style="background:var(--green-500)"><span class="n">success · stable</span><span class="h">#22c55e</span></div>
<div class="sw" style="background:var(--amber-500)"><span class="n">warning · moderate</span><span class="h">#eab308</span></div>
<div class="sw" style="background:var(--red-500)"><span class="n">danger · LIVE · poor</span><span class="h">#ef4444</span></div>
<div class="sw" style="background:var(--violet-500);color:#fff"><span class="n">smart · AI</span><span class="h">#8b5cf6</span></div>
</body></html>
