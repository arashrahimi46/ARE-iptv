<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-body)}
.lbl{font:var(--fw-bold) 11px/1 var(--font-body);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary);margin:0 0 14px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { SidebarNav, Tabs } = window.AREIptvDesignSystem_632b75;
const items=[{id:"home",label:"Home",icon:"home"},{id:"live",label:"Live TV",icon:"tv"},{id:"movies",label:"Movies",icon:"film"},{id:"series",label:"Series",icon:"clapperboard"},{id:"guide",label:"Guide",icon:"layout-grid"},{id:"search",label:"Search",icon:"search"},{id:"favorites",label:"Favorites",icon:"heart"},{id:"settings",label:"Settings",icon:"settings"}];
function Card(){
  const [tab,setTab]=React.useState("live");
  return (<div style={{display:'flex',height:420}}>
    <SidebarNav items={items} active="live" expanded/>
    <div style={{flex:1,padding:'28px 32px'}}>
      <p className="lbl">Tabs</p>
      <Tabs active={tab} onSelect={setTab} items={[{id:"overview",label:"Overview"},{id:"live",label:"Live"},{id:"movies",label:"Movies"},{id:"series",label:"Series"},{id:"cast",label:"Cast"}]}/>
      <p className="lbl" style={{marginTop:32}}>Collapsed rail (loses focus)</p>
      <div style={{height:200,display:'flex'}}><SidebarNav items={items} active="home"/></div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script>
</body>
</html>
