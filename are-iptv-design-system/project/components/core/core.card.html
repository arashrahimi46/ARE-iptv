<!-- @dsCard group="Components" viewport="700x430" name="Core — Buttons, Chips, Badges" subtitle="Actions, toggles and status overlines with TV focus" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg-base);padding:26px 28px;font-family:var(--font-body)}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.lbl{font:var(--fw-bold) 11px/1 var(--font-body);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary);margin:0 0 12px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Chip, Badge, Icon } = window.AREIptvDesignSystem_632b75;
function Card(){
  return (<div>
    <p className="lbl">Buttons — primary · secondary · ghost · danger</p>
    <div className="row">
      <Button variant="primary" icon={<Icon name="play" size={20}/>}>Play</Button>
      <Button variant="secondary" icon={<Icon name="layout-grid" size={20}/>}>Open guide</Button>
      <Button variant="ghost">Cancel</Button>
      <Button variant="danger" icon={<Icon name="trash-2" size={20}/>}>Remove</Button>
      <Button variant="primary" focused>Focused</Button>
    </div>
    <p className="lbl">Icon buttons — glass HUD · solid · active</p>
    <div className="row">
      <IconButton label="rw" variant="glass"><Icon name="rewind"/></IconButton>
      <IconButton label="play" variant="glass" size="lg" active><Icon name="pause" size={28}/></IconButton>
      <IconButton label="ff" variant="glass"><Icon name="fast-forward"/></IconButton>
      <IconButton label="fav" variant="solid" active><Icon name="heart"/></IconButton>
      <IconButton label="pip" variant="solid"><Icon name="picture-in-picture-2"/></IconButton>
    </div>
    <p className="lbl">Chips — filter / category</p>
    <div className="row">
      <Chip selected>All</Chip>
      <Chip icon={<Icon name="tv" size={16}/>}>Live TV</Chip>
      <Chip icon={<Icon name="film" size={16}/>}>Movies</Chip>
      <Chip dot="var(--health-stable)">Sports</Chip>
    </div>
    <p className="lbl">Badges — status overlines</p>
    <div className="row">
      <Badge tone="live" glow>LIVE</Badge>
      <Badge tone="quality">4K HDR</Badge>
      <Badge tone="new">NEW</Badge>
      <Badge tone="catchup">CATCH-UP</Badge>
      <Badge tone="smart" glow>SMART</Badge>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script>
</body>
</html>
