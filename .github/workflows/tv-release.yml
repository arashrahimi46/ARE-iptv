name: tv-release

# Manually-triggered release build for the :tv module. Produces a signed
# release AAB suitable for upload to the Play Console (Internal Testing
# track first). Requires the following repo secrets to be configured
# before this can succeed:
#   TV_RELEASE_KEYSTORE_BASE64   - base64-encoded upload keystore file
#   TV_RELEASE_KEYSTORE_PASSWORD
#   TV_RELEASE_KEY_ALIAS
#   TV_RELEASE_KEY_PASSWORD
#
# The :tv module's signingConfigs.release (tv/build.gradle.kts) already
# reads TV_RELEASE_KEYSTORE_PATH/PASSWORD/KEY_ALIAS/KEY_PASSWORD from env
# vars -- this workflow just decodes the keystore secret to a temp file
# and wires the env vars through.
#
# Play Store upload is NOT automated yet -- this workflow only produces
# the signed AAB as a build artifact. Uploading to the Internal Testing
# track is a manual step in Play Console until a service-account
# credential is provided for the Play Developer API.

on:
  workflow_dispatch: {}

jobs:
  bundle-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TV_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "TV_RELEASE_KEYSTORE_BASE64 secret is not set -- cannot produce a signed release build." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tv-release.keystore"

      - name: Bundle tv release (AAB)
        env:
          TV_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/tv-release.keystore
          TV_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TV_RELEASE_KEYSTORE_PASSWORD }}
          TV_RELEASE_KEY_ALIAS: ${{ secrets.TV_RELEASE_KEY_ALIAS }}
          TV_RELEASE_KEY_PASSWORD: ${{ secrets.TV_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :tv:bundleRelease --stacktrace

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: tv-release-aab
          path: tv/build/outputs/bundle/release/tv-release.aab
