name: tv-ci

# Bare CI for the :tv module only. The :mobile module is out of scope and is
# intentionally not built/linted here.

on:
  push:
    branches: ["**"]
    paths:
      - "tv/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/tv-ci.yml"
  pull_request:
    paths:
      - "tv/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/tv-ci.yml"

jobs:
  assemble-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble tv debug
        run: ./gradlew :tv:assembleDebug --stacktrace

      - name: Lint tv debug
        run: ./gradlew :tv:lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-lint-report
          path: tv/build/reports/lint-results-debug.html
          if-no-files-found: ignore
